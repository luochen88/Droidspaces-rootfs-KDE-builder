name: Build Gentoo Base RootFS

on:
  workflow_dispatch:
    inputs:
      custom_username:
        description: 'RootFS username'
        required: false
        type: string
        default: 'Gold'
      enable_zh_tz:
        description: 'Enable zh_CN.UTF-8 and Asia/Shanghai timezone'
        required: true
        type: boolean
        default: true
      enable_mesa:
        description: 'Inject Snapdragon KGSL/Mesa runtime environment variables'
        required: true
        type: boolean
        default: true
      enable_yj:
        description: 'Enable Droidspaces hardware/network recognition systemd rules'
        required: true
        type: boolean
        default: true
      enable_binfmt:
        description: 'Include Droidspaces binfmt service files'
        required: true
        type: boolean
        default: false
      pulseaudio:
        description: 'PulseAudio forwarding mode'
        required: true
        type: choice
        default: 'socket'
        options:
          - socket
          - tcp
          - none
      gentoo_common_flags:
        description: 'Initial Gentoo COMMON_FLAGS; can be replaced later inside rootfs'
        required: false
        type: string
        default: '-O2 -pipe -march=armv8-a'
      gentoo_makeopts:
        description: 'Initial Gentoo MAKEOPTS; can be replaced later inside rootfs'
        required: false
        type: string
        default: '-j4'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare metadata
        id: meta
        run: |
          build_id="gentoo-base-v$(date +'%Y%m%d-%H%M%S')"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Build Gentoo base rootfs
        run: |
          set -euo pipefail
          temp_tar="custom-Gentoo-Base-rootfs.tar"
          final_name="Gentoo-Base-Droidspaces-rootfs-aarch64-${{ steps.meta.outputs.build_id }}.tar.xz"

          docker buildx build \
            --platform linux/arm64 \
            --target export \
            --output type=tar,dest="$temp_tar" \
            --build-arg USERNAME="${{ inputs.custom_username }}" \
            --build-arg PulseAudio="${{ inputs.pulseaudio }}" \
            --build-arg ENABLE_zh_tz_ARG="${{ inputs.enable_zh_tz }}" \
            --build-arg ENABLE_yj_ARG="${{ inputs.enable_yj }}" \
            --build-arg ENABLE_mesa_ARG="${{ inputs.enable_mesa }}" \
            --build-arg ENABLE_binfmt_ARG="${{ inputs.enable_binfmt }}" \
            --build-arg GENTOO_COMMON_FLAGS="${{ inputs.gentoo_common_flags }}" \
            --build-arg GENTOO_MAKEOPTS="${{ inputs.gentoo_makeopts }}" \
            -f Gentoo-Base.Dockerfile \
            .

          tar -tf "$temp_tar" | grep -E '^(etc/droidspaces|usr/local/sbin/ds-apply-optimizations|etc/portage/make.conf|etc/environment)' | sort
          xz -T0 -9 -f "$temp_tar"
          mv "${temp_tar}.xz" "$final_name"
          sha256sum "$final_name" > "${final_name}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gentoo-base-rootfs
          path: |
            Gentoo-Base-Droidspaces-rootfs-aarch64-*.tar.xz
            Gentoo-Base-Droidspaces-rootfs-aarch64-*.sha256
          retention-days: 7

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.build_id }}
          name: Gentoo Base Droidspaces RootFS ${{ steps.meta.outputs.build_id }}
          files: |
            Gentoo-Base-Droidspaces-rootfs-aarch64-*.tar.xz
            Gentoo-Base-Droidspaces-rootfs-aarch64-*.sha256
          body: |
            Gentoo Base Droidspaces RootFS
            Build time: ${{ steps.meta.outputs.build_date }}

            This build intentionally does not install KDE. It only provides a bootable Gentoo systemd base rootfs, Droidspaces compatibility rules, and an optimization injection entrypoint.

            Options:
            - username: ${{ inputs.custom_username }}
            - zh_CN/timezone: ${{ inputs.enable_zh_tz }}
            - Snapdragon KGSL/Mesa env: ${{ inputs.enable_mesa }}
            - Droidspaces hardware/network rules: ${{ inputs.enable_yj }}
            - binfmt service files: ${{ inputs.enable_binfmt }}
            - PulseAudio: ${{ inputs.pulseaudio }}
            - initial COMMON_FLAGS: ${{ inputs.gentoo_common_flags }}
            - initial MAKEOPTS: ${{ inputs.gentoo_makeopts }}

            After importing the rootfs, device-specific optimization can be injected by editing /etc/droidspaces/optimization.env and running ds-apply-optimizations.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
